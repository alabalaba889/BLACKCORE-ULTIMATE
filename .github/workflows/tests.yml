name: BLACKCORE checks
on:
  push:
  pull_request:
jobs:
  unit-tests:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python files
        run: python -m compileall -q blackcore.py blackcore_core tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
